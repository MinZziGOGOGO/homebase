<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homebase Dashboard</title>
<style>
:root {
  --bg: #0f1117;
  --card-bg: #1a1d27;
  --border: #2a2d3a;
  --text: #e1e4ed;
  --muted: #8b8fa3;
  --accent: #6c8cff;
  --green: #4ade80;
  --red: #f87171;
  --yellow: #facc15;
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  padding: 24px;
  min-height: 100vh;
}
h1 {
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 24px;
  letter-spacing: -0.02em;
}
h1 span { color: var(--accent); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  max-width: 1400px;
}
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  min-height: 120px;
}
.card h2 {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-bottom: 12px;
}
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.stat-label { font-size: 0.75rem; color: var(--muted); }
.stat-value { font-size: 1.1rem; font-weight: 600; }
.progress-bar {
  height: 6px;
  border-radius: 3px;
  background: var(--border);
  margin-top: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 1s ease;
}
.progress-fill.safe { background: var(--green); }
.progress-fill.warn { background: var(--yellow); }
.progress-fill.danger { background: var(--red); }
.todo-input, .note-title, .note-content {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 8px 12px;
  font-size: 0.9rem;
  font-family: var(--font);
  margin-bottom: 8px;
}
.todo-input:focus, .note-title:focus, .note-content:focus {
  outline: none;
  border-color: var(--accent);
}
.note-content { min-height: 80px; resize: vertical; }
.btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 8px 16px;
  font-size: 0.85rem;
  cursor: pointer;
  font-weight: 600;
  transition: opacity 0.15s;
}
.btn:hover { opacity: 0.85; }
.btn-sm {
  padding: 4px 10px;
  font-size: 0.75rem;
  background: var(--border);
  color: var(--text);
}
.btn-sm:hover { background: var(--muted); }
.todo-list, .note-list { list-style: none; margin-top: 10px; }
.todo-item, .note-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
}
.todo-item:last-child, .note-item:last-child { border-bottom: none; }
.todo-item.completed .todo-text {
  text-decoration: line-through;
  color: var(--muted);
}
.todo-text, .note-info { flex: 1; }
.todo-check {
  width: 18px; height: 18px;
  border-radius: 4px;
  border: 2px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  flex-shrink: 0;
  background: transparent;
  color: transparent;
}
.todo-item.completed .todo-check {
  background: var(--green);
  border-color: var(--green);
  color: #000;
}
.note-title-text { font-weight: 600; margin-bottom: 2px; }
.note-content-text { color: var(--muted); font-size: 0.8rem; white-space: pre-wrap; }
.weather-main { display: flex; align-items: center; gap: 16px; }
.weather-temp { font-size: 2.4rem; font-weight: 700; }
.weather-desc { color: var(--muted); text-transform: capitalize; }
.weather-details { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 0.8rem; color: var(--muted); }
.delete-btn {
  color: var(--red);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 0.85rem;
  padding: 2px 6px;
  opacity: 0.5;
}
.delete-btn:hover { opacity: 1; }
.uptime-card .stat-value { font-size: 1.4rem; }
.empty-msg { color: var(--muted); font-size: 0.85rem; padding: 8px 0; }
.connected-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; }
@media (max-width: 600px) { body { padding: 12px; } }

/* --- Navigation --- */
.nav {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
}
.nav-tab {
  padding: 10px 20px;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 600;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all 0.15s;
}
.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.page { display: none; }
.page.active { display: block; }

/* --- Services grid --- */
.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
  max-width: 1400px;
}
.service-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  align-items: flex-start;
  gap: 16px;
  transition: border-color 0.2s;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}
.service-card:hover { border-color: var(--accent); }
.service-icon {
  font-size: 2rem;
  line-height: 1;
  flex-shrink: 0;
}
.service-info { flex: 1; }
.service-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
.service-desc { color: var(--muted); font-size: 0.8rem; margin-bottom: 8px; }
.service-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 600;
}
.service-status.up { background: rgba(74,222,128,0.15); color: var(--green); }
.service-status.down { background: rgba(248,113,113,0.15); color: var(--red); }
.service-status .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: currentColor;
}

</style>
</head>
<body>

<h1><span>&#9670;</span> Homebase</h1>

<div class="nav">
  <button class="nav-tab active" onclick="switchPage('dashboard')">Dashboard</button>
  <button class="nav-tab" onclick="switchPage('services')">Services</button>
</div>

<!-- Dashboard page -->
<div class="page active" id="page-dashboard">
<div class="grid">

  <!-- CPU -->
  <div class="card">
    <h2>CPU <span class="connected-dot" id="conn-dot"></span></h2>
    <div class="stat-grid">
      <div>
        <div class="stat-label">Usage</div>
        <div class="stat-value" id="cpu-pct">--</div>
        <div class="progress-bar"><div class="progress-fill" id="cpu-bar" style="width:0%"></div></div>
      </div>
      <div>
        <div class="stat-label">Cores</div>
        <div class="stat-value" id="cpu-count">--</div>
      </div>
    </div>
  </div>

  <!-- RAM -->
  <div class="card">
    <h2>Memory</h2>
    <div class="stat-grid">
      <div>
        <div class="stat-label">Used</div>
        <div class="stat-value" id="ram-used">--</div>
      </div>
      <div>
        <div class="stat-label">Total</div>
        <div class="stat-value" id="ram-total">--</div>
      </div>
    </div>
    <div class="progress-bar" style="margin-top:10px"><div class="progress-fill" id="ram-bar" style="width:0%"></div></div>
    <div class="stat-label" style="margin-top:4px"><span id="ram-pct">--</span>% used</div>
  </div>

  <!-- Disk -->
  <div class="card">
    <h2>Disk</h2>
    <div class="stat-grid">
      <div>
        <div class="stat-label">Used</div>
        <div class="stat-value" id="disk-used">--</div>
      </div>
      <div>
        <div class="stat-label">Total</div>
        <div class="stat-value" id="disk-total">--</div>
      </div>
    </div>
    <div class="progress-bar" style="margin-top:10px"><div class="progress-fill" id="disk-bar" style="width:0%"></div></div>
    <div class="stat-label" style="margin-top:4px"><span id="disk-pct">--</span>% used</div>
  </div>

  <!-- Uptime -->
  <div class="card uptime-card">
    <h2>Uptime</h2>
    <div class="stat-value" id="uptime">--</div>
  </div>

  <!-- Weather -->
  <div class="card">
    <h2>Weather · Vienna</h2>
    <div class="weather-main">
      <div class="weather-temp" id="w-temp">--</div>
      <div>
        <div class="weather-desc" id="w-desc">Loading...</div>
      </div>
    </div>
    <div class="weather-details" id="w-details"></div>
  </div>

  <!-- Todos -->
  <div class="card">
    <h2>Todos</h2>
    <input class="todo-input" id="todo-input" placeholder="Add a task..." onkeydown="if(event.key==='Enter')addTodo()">
    <button class="btn" onclick="addTodo()">Add</button>
    <ul class="todo-list" id="todo-list"></ul>
  </div>

  <!-- Notes -->
  <div class="card" style="grid-column: span 1">
    <h2>Notes</h2>
    <input class="note-title" id="note-title" placeholder="Title">
    <textarea class="note-content" id="note-content" placeholder="Write markdown..."></textarea>
    <button class="btn" onclick="saveNote()">Save Note</button>
    <ul class="note-list" id="note-list"></ul>
  </div>

</div>
</div>

<!-- Services page -->
<div class="page" id="page-services">
  <div class="services-grid" id="services-grid"></div>
</div>

<script>
// --- WebSocket ---
const dot = document.getElementById('conn-dot');
let ws;
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/stats`);
  ws.onopen = () => { dot.style.background = 'var(--green)'; };
  ws.onclose = () => { dot.style.background = 'var(--red)'; setTimeout(connectWS, 3000); };
  ws.onerror = () => { dot.style.background = 'var(--red)'; };
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    updateStats(d);
  };
}
connectWS();

function barClass(pct) {
  return pct > 85 ? 'danger' : pct > 65 ? 'warn' : 'safe';
}
function setBar(id, pct) {
  const el = document.getElementById(id);
  el.style.width = pct + '%';
  el.className = 'progress-fill ' + barClass(pct);
}

function formatUptime(sec) {
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  let parts = [];
  if (d) parts.push(d + 'd');
  if (h) parts.push(h + 'h');
  if (m || !parts.length) parts.push(m + 'm');
  return parts.join(' ');
}

function updateStats(d) {
  document.getElementById('cpu-pct').textContent = d.cpu_percent + '%';
  setBar('cpu-bar', d.cpu_percent);
  document.getElementById('cpu-count').textContent = d.cpu_count;
  document.getElementById('ram-used').textContent = d.ram.used_gb + ' GB';
  document.getElementById('ram-total').textContent = d.ram.total_gb + ' GB';
  document.getElementById('ram-pct').textContent = d.ram.percent;
  setBar('ram-bar', d.ram.percent);
  document.getElementById('disk-used').textContent = d.disk.used_gb + ' GB';
  document.getElementById('disk-total').textContent = d.disk.total_gb + ' GB';
  document.getElementById('disk-pct').textContent = d.disk.percent;
  setBar('disk-bar', d.disk.percent);
  document.getElementById('uptime').textContent = formatUptime(d.uptime_seconds);
}

// --- Weather ---
async function loadWeather() {
  try {
    const r = await fetch('/api/weather?city=Vienna');
    const d = await r.json();
    const cur = d.current_condition[0];
    document.getElementById('w-temp').textContent = cur.temp_C + '°C';
    document.getElementById('w-desc').textContent = cur.weatherDesc[0].value;
    document.getElementById('w-details').innerHTML =
      `<div>Humidity</div><div>${cur.humidity}%</div>
       <div>Wind</div><div>${cur.windspeedKmph} km/h</div>
       <div>Feels like</div><div>${cur.FeelsLikeC}°C</div>
       <div>Visibility</div><div>${cur.visibility} km</div>`;
  } catch(e) {
    document.getElementById('w-desc').textContent = 'Weather unavailable';
  }
}
loadWeather();

// --- Todos ---
async function loadTodos() {
  const r = await fetch('/api/todos');
  const items = await r.json();
  const list = document.getElementById('todo-list');
  if (!items.length) {
    list.innerHTML = '<div class="empty-msg">No tasks yet</div>';
    return;
  }
  list.innerHTML = items.map(t => `
    <li class="todo-item${t.completed?' completed':''}">
      <button class="todo-check" onclick="toggleTodo('${t.id}')">${t.completed?'✓':''}</button>
      <span class="todo-text">${escapeHtml(t.text)}</span>
      <button class="delete-btn" onclick="deleteTodo('${t.id}')">✕</button>
    </li>`).join('');
}
async function addTodo() {
  const inp = document.getElementById('todo-input');
  const text = inp.value.trim();
  if (!text) return;
  await fetch('/api/todos', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({text})
  });
  inp.value = '';
  loadTodos();
}
async function toggleTodo(id) {
  await fetch('/api/todos/' + id, {method:'PUT'});
  loadTodos();
}
async function deleteTodo(id) {
  await fetch('/api/todos/' + id, {method:'DELETE'});
  loadTodos();
}
loadTodos();

// --- Notes ---
async function loadNotes() {
  const r = await fetch('/api/notes');
  const items = await r.json();
  const list = document.getElementById('note-list');
  if (!items.length) {
    list.innerHTML = '<div class="empty-msg">No notes yet</div>';
    return;
  }
  list.innerHTML = items.map(n => `
    <li class="note-item">
      <div class="note-info">
        <div class="note-title-text">${escapeHtml(n.title)}</div>
        <div class="note-content-text">${escapeHtml(n.content.substring(0, 120))}</div>
      </div>
      <button class="delete-btn" onclick="deleteNote('${n.id}')">✕</button>
    </li>`).join('');
}
async function saveNote() {
  const title = document.getElementById('note-title').value.trim();
  const content = document.getElementById('note-content').value.trim();
  if (!title || !content) return;
  await fetch('/api/notes', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({title, content})
  });
  document.getElementById('note-title').value = '';
  document.getElementById('note-content').value = '';
  loadNotes();
}
async function deleteNote(id) {
  await fetch('/api/notes/' + id, {method:'DELETE'});
  loadNotes();
}
loadNotes();

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- Page switching ---
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'services') loadServices();
}

// --- Services ---
let servicesInterval;
async function loadServices() {
  try {
    const r = await fetch('/api/services');
    const services = await r.json();
    const grid = document.getElementById('services-grid');
    const hostname = window.location.hostname;
    grid.innerHTML = services.map(s => {
      // Rewrite any remaining localhost URLs to the actual hostname
      let url = s.url.replace('localhost', hostname);
      return `
      <a class="service-card" href="${url}" target="_blank">
        <div class="service-icon">${s.icon}</div>
        <div class="service-info">
          <div class="service-name">${s.name}</div>
          <div class="service-desc">${s.desc}</div>
          <span class="service-status ${s.up ? 'up' : 'down'}">
            <span class="dot"></span> ${s.up ? 'Online' : 'Offline'}
          </span>
        </div>
      </a>`;
    }).join('');
  } catch(e) { console.error(e); }
  if (servicesInterval) clearInterval(servicesInterval);
  servicesInterval = setInterval(loadServices, 30000);
}
</script>
</body>
</html>
